[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trader-agent"
version = "0.1.0"
description = "Reflective reasoning crypto paper-trading agent"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tyler", email = "harbtj7@gmail.com" }]

dependencies = [
    # Broker / market data
    "alpaca-py==0.43.4",
    # LLM
    "anthropic==0.52.0",
    # Data
    "pandas==3.0.2",
    "numpy==2.2.6",
    "pyarrow==22.0.0",
    # Technical analysis
    "ta==0.11.0",
    # ML
    "scikit-learn==1.7.2",
    # Backtesting
    "backtesting==0.6.5",
    # Scheduling
    "APScheduler==3.11.2",
    # Web / dashboard
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    # Config / secrets
    "python-dotenv==1.1.0",
    # Logging
    "structlog==24.4.0",
    # Schema validation
    "pydantic==2.11.4",
    "pydantic-settings==2.7.0",
    # Database
    "sqlalchemy==2.0.41",
    "aiosqlite==0.20.0",
    # Utilities
    "tenacity==9.1.2",
    "rich==14.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==0.26.0",
    "pytest-cov==7.0.0",
    "pytest-mock==3.14.0",
    "ruff==0.8.6",
    "black==24.10.0",
    "pre-commit==4.0.1",
    "freezegun==1.5.1",
    "respx==0.21.1",
]

[project.scripts]
trader = "agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "tests*"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PTH", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent"]

# ── Black ─────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=agent --cov-report=term-missing --cov-fail-under=80"
log_cli = true
log_cli_level = "INFO"

[tool.coverage.run]
omit = [
    "tests/*",
    "agent/dashboard/*",
    "agent/main.py",
    # IO-only modules: live API calls, not unit-testable without integration fixtures
    "agent/data/ingestion.py",
    "agent/reasoning/claude_adapter.py",
    "agent/reasoning/local_adapter.py",
    "scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
